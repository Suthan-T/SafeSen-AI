<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeSen-AI Women Safety Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }
        .auth-header {
            background: #0f172a;
            color: #ffffff;
            padding: 2rem;
            text-align: center;
        }
        .demo-pill {
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f1f5f9;
            border: 1px dashed #cbd5e1;
        }
        .demo-pill:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger text-white rounded-circle p-3 mb-3 shadow">
                    <i class="bi bi-shield-lock-fill fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">SafeSen-AI</h3>
                <p class="text-secondary small mb-0">Women Safety Analytics – Protecting Women from Safety Threats</p>
                <div class="badge bg-danger mt-2">V.S.B. Engineering College, Karur</div>
            </div>

            <div class="p-4 p-md-4">
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                <div th:if="${logoutMessage}" class="alert alert-info py-2 small" th:text="${logoutMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="emailInput" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-primary fw-bold py-2" style="background: #0f172a; border-color: #0f172a;">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to SafeSen-AI
                        </button>
                    </div>

                    <!-- Instant 1-Click Demo Credentials for Examiners & Review -->
                    <div class="card border-0 bg-light p-2 mb-3">
                        <span class="small fw-bold text-muted mb-1"><i class="bi bi-lightning-charge-fill text-warning"></i> Demo Quick Login (Click to fill):</span>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm demo-pill text-start flex-grow-1" onclick="fillCreds('preethi@example.com', 'user123')">
                                <span class="d-block fw-bold text-dark small"><i class="bi bi-person-fill text-success"></i> Commuter</span>
                                <span class="d-block text-muted" style="font-size: 0.72rem;">preethi@example.com</span>
                            </button>
                            <button type="button" class="btn btn-sm demo-pill text-start flex-grow-1" onclick="fillCreds('admin@safesen.ai', 'admin123')">
                                <span class="d-block fw-bold text-dark small"><i class="bi bi-shield-fill text-danger"></i> Administrator</span>
                                <span class="d-block text-muted" style="font-size: 0.72rem;">admin@safesen.ai</span>
                            </button>
                        </div>
                    </div>

                    <div class="text-center small text-muted">
                        Don't have an account? <a th:href="@{/register}" class="fw-bold text-decoration-none">Register New Commuter</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(email, password) {
            document.getElementById('emailInput').value = email;
            document.getElementById('passwordInput').value = password;
        }
    </script>
</body>
</html>
