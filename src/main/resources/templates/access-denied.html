<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card border-0 shadow text-center p-4 p-md-5" style="max-width: 480px; border-radius: 16px;">
        <div class="text-danger mb-3">
            <i class="bi bi-shield-slash-fill" style="font-size: 4rem;"></i>
        </div>
        <h3 class="fw-bold text-dark">403 - Access Denied</h3>
        <p class="text-muted small">
            You do not have administrative privileges to access this area. This action has been logged for security auditing.
        </p>
        <div class="mt-3">
            <a th:href="@{/dashboard}" class="btn btn-primary fw-bold" style="background: #0f172a; border-color: #0f172a;">
                <i class="bi bi-arrow-left me-1"></i> Return to Safety Dashboard
            </a>
        </div>
    </div>
</body>
</html>
